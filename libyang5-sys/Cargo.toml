[package]
name = "libyang5-sys"
version = "0.1.0"
authors = ["Renato Westphal <renato@opensourcerouting.org>"]
description = "Raw FFI bindings for libyang5"
keywords = ["yang", "libyang"]
edition = "2018"
license = "BSD-3-Clause"
documentation = "https://docs.rs/libyang5-sys"
categories = ["external-ffi-bindings"]

[dependencies]

[build-dependencies]
bindgen = { version = "0.72.0", optional = true }
cmake = { version = "0.1", optional = true }
pkg-config = "0.3.32"

[features]
# Use pre-generated FFI bindings
default = []
# Generate FFI bindings dynamically.
# For this to work libyang5 needs to be installed in the system.
bindgen = ["dep:bindgen"]
# Bundle libyang5 C files into a static archive linked to this crate.
# This removes the libyang5 dynamic link dependency.
bundled = ["dep:cmake"]
